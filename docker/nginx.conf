server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad (RNF-05)
    add_header X-Content-Type-Options   "nosniff"            always;
    add_header X-Frame-Options          "DENY"               always;
    add_header Referrer-Policy          "no-referrer"        always;
    add_header Permissions-Policy       "camera=(self), microphone=(self), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Healthcheck (RNF-09)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Los artefactos con hash en el nombre se cachean fuerte.
    location ~* \.(?:js|css|wasm|woff2|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El shell nunca se cachea: si se cachea, un deploy nuevo no llega al
    # usuario hasta que limpie el navegador.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback para go_router en modo path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
