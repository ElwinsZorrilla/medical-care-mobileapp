# Front web servido por nginx — RNF-05, RNF-09.
#
# Este archivo se monta en /etc/nginx/conf.d/default.conf, que nginx incluye
# DENTRO del bloque `http`. Por eso `limit_req_zone` puede vivir aca: es
# directiva de contexto http, no de server.

# ── Rate limit (RNF-05) ──────────────────────────────────────────────────
#
# Una SPA pide decenas de archivos de golpe en el primer arranque —
# flutter_bootstrap.js, main.dart.js, canvaskit.wasm, las fuentes, el
# manifest— asi que un limite estrecho rompe la carga inicial en vez de
# frenar un abuso. 30 r/s sostenido con rafaga de 100 sin retardo deja pasar
# el arranque completo y sigue cortando a quien pida en bucle.
# Ojo al desplegar detras de un proxy o balanceador: sin
# `set_real_ip_from` + `real_ip_header`, $binary_remote_addr es la IP del
# proxy y **todos los clientes comparten la misma cuota**. Acá no se pone
# porque depende de la red donde se despliegue y una IP de confianza
# equivocada permite falsificar la del cliente.
limit_req_zone $binary_remote_addr zone=spa:10m rate=30r/s;

# nginx devuelve 503 por omision, que significa "el servidor esta caido" y
# haria que el monitoreo abriera una incidencia por un cliente pesado. 429 es
# lo correcto: el servidor esta bien, quien pide es el que se paso.
limit_req_status 429;

# Necesario para que el proxy de /api pueda pasar websockets (RF-32, RF-35).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # `Server: nginx/1.27.5` le regala al atacante la version exacta con la
    # que buscar CVEs. Con esto queda solo `Server: nginx`.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # `.wasm` y las fuentes pesan mas que el JS en un build de Flutter web.
    # woff2 ya viene comprimido y no se lista: recomprimirlo gasta CPU sin
    # ganar bytes.
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        font/ttf;

    # ── Healthcheck (RNF-09) ─────────────────────────────────────────────
    #
    # Sin rate limit: lo consulta el HEALTHCHECK del contenedor cada 30 s y
    # el orquestador ademas. Que un pico de trafico lo tumbe haria que se
    # reinicie justo cuando mas se usa.
    #
    # `default_type` y no `add_header Content-Type`: add_header **agrega**,
    # no reemplaza, y la respuesta salia con dos Content-Type
    # (application/octet-stream y text/plain). Comprobado con curl.
    #
    # Comprueba ademas que el shell de la app esta en disco: un 200 fijo
    # tambien lo devolveria un contenedor con el volumen vacio.
    location = /healthz {
        # Tambien lleva las cabeceras: si no, deja de ser cierto que RNF-05
        # aplica a toda respuesta que sale de este servidor.
        include /etc/nginx/security-headers.conf;
        access_log off;
        default_type text/plain;
        if (!-f /usr/share/nginx/html/index.html) {
            return 503 "sin build\n";
        }
        return 200 "ok\n";
    }

    # ── API en el mismo origen ───────────────────────────────────────────
    #
    # El front y la API en puertos distintos son **origenes distintos**: el
    # navegador manda preflight y el backend no tiene CORS
    # (docs/BACKEND_ISSUES.md #2), asi que la app no funciona en un navegador
    # aunque el front este perfecto.
    #
    # Servir la API bajo /api del mismo origen elimina la condicion de
    # cross-origin en vez de intentar negociarla. Es ademas la topologia
    # normal en produccion, y es lo que permite que la CSP diga
    # `connect-src 'self'` sin meter el host del backend —que es un
    # --dart-define— dentro de una cabecera.
    #
    # `proxy_pass` con **variable** a proposito: con un nombre literal nginx
    # resuelve el DNS al arrancar y el contenedor no levanta si el backend no
    # existe. Con variable la resolucion se difiere a cada peticion, asi que
    # el front se puede levantar solo y /api responde 502 hasta que haya
    # backend.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        limit_req zone=spa burst=100 nodelay;

        # 127.0.0.11 es el DNS embebido de Docker y **solo existe en redes
        # definidas por el usuario**. En la bridge por defecto —o sea un
        # `docker run` pelado— no hay nada escuchando ahi, y sin
        # `resolver_timeout` cada llamada a /api se cuelga 30 s antes del
        # 502. Con 5 s el fallo es rapido y legible; el escenario correcto
        # sigue siendo compose, que crea su propia red.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $upstream_api "http://api:3000";
        proxy_pass $upstream_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # ── Service worker y version ─────────────────────────────────────────
    #
    # Deciden si hay build nueva. Si se cachean, el mecanismo de
    # actualizacion de Flutter queda congelado. Va antes que la regla de
    # estaticos porque ambos terminan en .js/.json.
    location ~* ^/(flutter_service_worker\.js|version\.json)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # ── Estaticos ────────────────────────────────────────────────────────
    #
    # **Sin `immutable`.** Flutter web NO pone hash en los nombres:
    # main.dart.js, flutter_bootstrap.js, canvaskit.wasm y assets/* tienen
    # nombre estable entre builds (comprobado listando la imagen). La regla
    # anterior les ponia `expires 1y; Cache-Control: public, immutable`, o
    # sea que tras un deploy el navegador seguia usando el JS viejo **un
    # ano** y ninguna correccion llegaba al usuario.
    #
    # Con revalidacion, nginx responde 304 usando ETag: el coste es un viaje
    # de ida y vuelta chico y el contenido nunca queda viejo. Cachear fuerte
    # exigiria nombres con hash, que Flutter no genera.
    location ~* \.(?:js|css|wasm|woff2|ttf|otf|png|jpg|jpeg|svg|json|symbols)$ {
        include /etc/nginx/security-headers.conf;
        limit_req zone=spa burst=100 nodelay;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ── SPA ──────────────────────────────────────────────────────────────
    #
    # El shell nunca se cachea: si se cachea, un deploy nuevo no llega hasta
    # que el usuario limpie el navegador.
    location / {
        include /etc/nginx/security-headers.conf;
        limit_req zone=spa burst=100 nodelay;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # Fallback para go_router en modo path.
        try_files $uri $uri/ /index.html;
    }
}
