# Cabeceras de seguridad — RNF-05.
#
# Vive en su propio archivo y se `include` en CADA location a proposito.
#
# En nginx `add_header` **no se hereda**: basta con que un `location` declare
# uno propio para que descarte todos los del bloque `server`. Antes estaban
# solo en `server`, y los tres `location` con `Cache-Control` propio los
# borraban. Medido contra el contenedor, el resultado era que
# `curl -I http://localhost:8080/` —el documento HTML, el unico sitio donde
# X-Frame-Options y CSP hacen algo— salia con **cero** cabeceras de seguridad.
# La configuracion se veia bien leyendola; servida, no protegia nada.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy       "no-referrer" always;

# Camara y microfono se permiten al propio origen: RF-35 (videollamada) los
# necesita. Todo lo demas cerrado; una app de historia clinica no tiene por
# que pedir ubicacion ni sensores.
add_header Permissions-Policy
  "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=(), interest-cohort=()"
  always;

# X-Frame-Options lo cubre `frame-ancestors` de la CSP en navegadores
# actuales, pero se mantiene por los que no la implementan. Sin esto, la app
# se puede embeber en un iframe de otro sitio y robarle clics a la sesion de
# un paciente.
add_header X-Frame-Options "DENY" always;

# Content-Security-Policy — ajustada a lo que Flutter web hace de verdad,
# comprobado sobre el build servido:
#
#   'wasm-unsafe-eval'  CanvasKit y skwasm compilan WebAssembly. Se verifico
#                       que NO hay `eval(` ni `new Function(` en
#                       flutter_bootstrap.js, flutter.js ni main.dart.js, asi
#                       que no hace falta 'unsafe-eval', que si seria un
#                       agujero.
#   blob:               skwasm arranca su worker desde un blob URL
#                       (URL.createObjectURL + new Worker, comprobado).
#   style-src inline    el motor inyecta estilos del shell en tiempo de
#                       ejecucion. Es la unica concesion, y aplica a estilos,
#                       no a scripts.
#   connect-src 'self'  la API se sirve por /api en este mismo origen (ver el
#                       proxy de nginx.conf). Mismo origen = sin preflight y
#                       sin tener que meter el host del backend —que es un
#                       --dart-define— dentro de la cabecera. Cubre tambien
#                       el `ws://` del mismo origen que va a necesitar
#                       RF-32: CSP3 empareja ws/wss con 'self'.
#
# **Riesgo declarado, no verificado en navegador.** `Avatar` pinta
# `urlFoto`, y en docs/openapi.json ese campo es un objeto sin formato: no
# se sabe si el backend devuelve ruta relativa o URL absoluta a otro host.
# Si fuera absoluta, `img-src`/`connect-src 'self'` la bloquean y el fallo
# es **mudo** — `CachedNetworkImage` cae a las iniciales por su
# `errorWidget` y nadie relaciona "los avatares salen con iniciales" con
# una cabecera de nginx. Cuando exista una foto real: o se sirve del mismo
# origen (bajo /api), o se agrega ese origen aca.
add_header Content-Security-Policy
  "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
  always;
